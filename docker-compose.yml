services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      PORT: 8080
      JWT_ACCESS_SECRET: yt7B6dMk5WGnq4DpDOFV6iez0kpqa0tt4eBFmqpM27O
      JWT_REFRESH_SECRET: p1GxOJj3l9DOu0h7FvAjTe8Q7f8vBrunG60MyL2gH0T
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-worker
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      JWT_ACCESS_SECRET: yt7B6dMk5WGnq4DpDOFV6iez0kpqa0tt4eBFmqpM27O
      JWT_REFRESH_SECRET: p1GxOJj3l9DOu0h7FvAjTe8Q7f8vBrunG60MyL2gH0T
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: